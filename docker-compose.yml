version: '3.8'

# ==============================================================================
# JOB SEARCH AUTOMATION - SCRAPER MICROSERVICE STACK
# Runs independently and connects to the shared Docker network (n8n_net)
# ==============================================================================

services:
  scraper-service:
    build:
      context: ./scraper-service
      dockerfile: Dockerfile
    container_name: jobsearch_scraper
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - LOG_LEVEL=info
      - PYTHONUNBUFFERED=1
    volumes:
      - ./scraper-service/app:/app/app
      - scraper_exports:/app/exports
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      n8n_net:
        aliases:
          - scraper-service

networks:
  n8n_net:
    external: true
    name: ${SHARED_NETWORK_NAME:-n8n_net}

volumes:
  scraper_exports:
